<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}ECPC Analytics{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { mono: ['JetBrains Mono', 'monospace'], syne: ['Syne', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body class="bg-[#0a0a0f] text-gray-100 min-h-screen flex font-mono">

  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar fixed top-0 left-0 h-full w-64 bg-[#0d0d14] border-r border-[#1e1e2e] z-50 flex flex-col overflow-hidden transition-transform duration-300">

    <!-- Logo -->
    <div class="px-5 py-5 border-b border-[#1e1e2e]">
      <a href="/" class="flex items-center gap-3">
        <div class="w-8 h-8 rounded bg-gradient-to-br from-[#e84545] to-[#ff6b6b] flex items-center justify-center text-white font-syne font-800 text-sm">EC</div>
        <div>
          <div class="font-syne font-bold text-white text-sm leading-tight">ECPC</div>
          <div class="text-[10px] text-[#e84545] tracking-widest uppercase">Analytics</div>
        </div>
      </a>
    </div>

    <!-- Nav -->
    <nav class="px-3 py-4 flex-1 overflow-y-auto scrollbar-thin">
      <div class="mb-4">
        <p class="text-[10px] uppercase tracking-widest text-gray-600 px-2 mb-2">Navigation</p>
        <a href="/" class="nav-item {% if request.path == '/' %}active{% endif %}">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
          Dashboard
        </a>
        <a href="/problems" class="nav-item {% if request.path == '/problems' %}active{% endif %}">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
          Problems Explorer
        </a>
      </div>

      <div>
        <p class="text-[10px] uppercase tracking-widest text-gray-600 px-2 mb-2">Contests</p>
        <div id="sidebar-contests" class="space-y-0.5">
          <div class="px-2 py-2 text-gray-600 text-xs">Loading...</div>
        </div>
      </div>
    </nav>

    <!-- Footer -->
    <div class="px-5 py-3 border-t border-[#1e1e2e]">
      <div class="text-[10px] text-gray-600 font-mono">ECPC Road · باشمهندس رفعت</div>
    </div>
  </aside>

  <!-- Main -->
  <div class="flex-1 ml-64 flex flex-col min-h-screen">

    <!-- Top bar -->
    <header class="h-14 border-b border-[#1e1e2e] bg-[#0d0d14]/80 backdrop-blur sticky top-0 z-40 flex items-center px-6 gap-4">
      <div class="flex-1">
        <h1 class="font-syne font-bold text-white text-base">{% block page_title %}Dashboard{% endblock %}</h1>
        <p class="text-[11px] text-gray-500">{% block page_subtitle %}ECPC Analytics Platform{% endblock %}</p>
      </div>
      <div class="flex items-center gap-2">
        <div id="status-dot" class="w-2 h-2 rounded-full bg-green-400 pulse-dot" title="API Connected"></div>
        <span class="text-xs text-gray-500">API Live</span>
      </div>
    </header>

    <!-- Content -->
    <main class="flex-1 p-6">
      {% block content %}{% endblock %}
    </main>

  </div>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
